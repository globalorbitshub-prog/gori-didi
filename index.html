<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gori Didi - Authentic Indian Products</title>
    <meta name="description" content="Gori Didi brings authentic Indian fashion, textiles and decor - sourced directly from artisans and markets across India - straight to your door.">
    <meta property="og:title" content="Gori Didi - Authentic Indian Products">
    <meta property="og:description" content="Authentic Indian fashion, textiles and decor, sourced directly from artisans across India.">
    <meta property="og:image" content="gori-logo-300.png">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#a42f36">
    <link rel="icon" href="gori-logo-300.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo-section">
            <img id="logoImg" src="gori-logo-300.png" alt="Gori Didi logo" class="logo-img" onerror="this.classList.add('hidden'); document.getElementById('logoFallback').classList.remove('hidden')">
            <span id="logoFallback" class="logo-fallback hidden">GD</span>
            <div>
                <div class="brand-name" id="brandName">Gori Didi</div>
                <div class="brand-tagline" data-en="From India" data-es="Desde India"></div>
            </div>
        </div>
        <button class="nav-toggle" id="navToggle" onclick="toggleNav()" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
        <nav class="nav-main" id="navMain">
            <button class="nav-btn" onclick="showPage('landing')" data-en="Home" data-es="Inicio"></button>
            <button class="nav-btn" onclick="showPage('catalog')" data-en="Products" data-es="Productos"></button>
            <button class="nav-btn" onclick="showPage('admin')" data-en="Admin" data-es="Administrador"></button>
        </nav>
        <div class="nav-right">
            <select class="lang-select" onchange="switchLang(this.value)" aria-label="Language">
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
            <button class="cart-icon" onclick="showPage('cart')" aria-label="Cart">🛒<span class="cart-badge" id="cartCount">0</span></button>
        </div>
    </header>

    <main class="main">
        <div id="landing" class="page">
            <div class="hero" id="hero">
                <h1 id="heroTitle"></h1>
                <p id="heroSub"></p>
                <button class="btn btn-primary" onclick="showPage('catalog')" data-en="Shop Now" data-es="Comprar Ahora"></button>
            </div>

            <div class="trust-strip">
                <div class="trust-item">
                    <div class="icon">🧵</div>
                    <div class="label" data-en="Directly Sourced" data-es="Compra Directa"></div>
                    <div class="desc" data-en="From artisans and markets across India" data-es="De artesanos y mercados de India"></div>
                </div>
                <div class="trust-item">
                    <div class="icon">✋</div>
                    <div class="label" data-en="Handmade Quality" data-es="Calidad Artesanal"></div>
                    <div class="desc" data-en="Traditional craftsmanship, made to last" data-es="Artesanía tradicional y duradera"></div>
                </div>
                <div class="trust-item">
                    <div class="icon">💬</div>
                    <div class="label" data-en="WhatsApp Support" data-es="Soporte por WhatsApp"></div>
                    <div class="desc" data-en="Order and ask questions directly" data-es="Pide y pregunta directamente"></div>
                </div>
                <div class="trust-item">
                    <div class="icon">🌍</div>
                    <div class="label" data-en="Worldwide Shipping" data-es="Envíos al Mundo"></div>
                    <div class="desc" data-en="Bringing India to your doorstep" data-es="Llevamos India hasta tu puerta"></div>
                </div>
            </div>

            <div class="story">
                <div class="story-content">
                    <div class="story-text">
                        <h2 data-en="Our Story" data-es="Nuestra Historia"></h2>
                        <p data-en="Gori Didi started with a backpack, a camera and a deep love for India - crossing swinging footbridges in Himachal, bargaining for bangles in crowded bazaars, and riding camels into the Jaisalmer desert."
                           data-es="Gori Didi nació con una mochila, una cámara y un amor profundo por India - cruzando puentes colgantes en Himachal, regateando pulseras en bazares llenos de vida y montando camellos en el desierto de Jaisalmer."></p>
                        <p data-en="Every product we sell is chosen from those same markets and artisans, so you can bring a piece of that journey home."
                           data-es="Cada producto que vendemos se elige de esos mismos mercados y artesanos, para que puedas llevarte a casa un pedazo de ese viaje."></p>
                    </div>
                    <div class="story-gallery">
                        <div class="story-thumb"><span class="thumb-icon">🛕</span><img src="6.jpg" alt="Meeting a sadhu at the ancient temple ruins of Hampi" loading="lazy" onerror="this.style.display='none'"></div>
                        <div class="story-thumb"><span class="thumb-icon">💍</span><img src="3.jpg" alt="Women trying on bangles at an Indian market stall" loading="lazy" onerror="this.style.display='none'"></div>
                        <div class="story-thumb"><span class="thumb-icon">🧸</span><img src="4.jpg" alt="Colorful wooden toys at a local shop" loading="lazy" onerror="this.style.display='none'"></div>
                        <div class="story-thumb"><span class="thumb-icon">🐫</span><img src="5.jpg" alt="Travelers with camel near the Jaisalmer fort" loading="lazy" onerror="this.style.display='none'"></div>
                    </div>
                </div>
            </div>

            <h2 class="section-title" data-en="Featured Products" data-es="Productos Destacados"></h2>
            <div class="grid" id="featuredGrid"></div>
        </div>

        <div id="catalog" class="page hidden">
            <h1 class="section-title" data-en="Our Collections" data-es="Nuestras Colecciones"></h1>
            <div class="categories" id="catsContainer"></div>
            <div class="grid" id="catalogGrid"></div>
        </div>

        <div id="cart" class="page hidden">
            <h1 class="section-title" data-en="Shopping Cart" data-es="Carrito de Compras"></h1>
            <div class="cart-container" id="cartView"></div>
        </div>

        <div id="admin" class="page hidden">
            <h1 class="section-title" data-en="Admin Panel" data-es="Panel de Administrador"></h1>

            <div id="loginForm" class="section" style="max-width: 400px;">
                <h2 class="section-title-2" data-en="Login" data-es="Iniciar Sesión"></h2>
                <div class="form-group">
                    <label data-en="Email" data-es="Correo Electrónico"></label>
                    <input type="email" id="email" placeholder="oscar@gorididi.com">
                </div>
                <div class="form-group">
                    <label data-en="Password" data-es="Contraseña"></label>
                    <input type="password" id="pwd" placeholder="••••••">
                </div>
                <button class="btn btn-primary btn-small" onclick="adminLogin()" data-en="Login" data-es="Entrar"></button>
            </div>

            <div id="adminPanel" class="hidden">
                <div class="admin-grid">
                    <div class="section">
                        <h2 class="section-title-2" data-en="Business Settings" data-es="Configuración del Negocio"></h2>
                        <div class="form-group">
                            <label data-en="Business Name" data-es="Nombre del Negocio"></label>
                            <input type="text" id="bizName">
                        </div>
                        <div class="form-group">
                            <label data-en="Hero Title" data-es="Título del Hero"></label>
                            <input type="text" id="heroTit">
                        </div>
                        <div class="form-group">
                            <label data-en="Hero Subtitle" data-es="Subtítulo del Hero"></label>
                            <input type="text" id="heroSubIn">
                        </div>
                        <div class="form-group">
                            <label data-en="WhatsApp Number (with country code)" data-es="Número de WhatsApp (con código de país)"></label>
                            <input type="text" id="bizWhatsapp" placeholder="15551234567">
                        </div>
                        <button class="btn btn-primary btn-small" onclick="saveBiz()" data-en="Save" data-es="Guardar"></button>
                    </div>

                    <div class="section">
                        <h2 class="section-title-2" data-en="Add Product" data-es="Agregar Producto"></h2>
                        <div class="form-group">
                            <label data-en="Product Name" data-es="Nombre del Producto"></label>
                            <input type="text" id="prodName">
                        </div>
                        <div class="form-group">
                            <label data-en="Category" data-es="Categoría"></label>
                            <select id="prodCat">
                                <option>MODA</option>
                                <option>TRAJES</option>
                                <option>ACCESORIOS</option>
                                <option>TEXTIL</option>
                                <option>DECORACIÓN</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label data-en="Price USD" data-es="Precio USD"></label>
                            <input type="number" id="prodPrice" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label data-en="Image URL (optional)" data-es="URL de Imagen (opcional)"></label>
                            <input type="text" id="prodImg" placeholder="https://...">
                            <div class="form-hint" data-en="Leave empty to use an emoji placeholder" data-es="Déjalo vacío para usar un emoji de referencia"></div>
                        </div>
                        <button class="btn btn-primary btn-small" onclick="addProd()" data-en="Add" data-es="Agregar"></button>
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title-2" data-en="Products" data-es="Productos"></h2>
                    <div id="prodsList"></div>
                </div>

                <button class="btn btn-dark btn-small" onclick="adminLogout()" data-en="Logout" data-es="Cerrar Sesión"></button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-brand" id="footerBrand">Gori Didi</div>
        <p data-en="Authentic Indian Products" data-es="Productos Indios Auténticos"></p>
        <div class="footer-links">
            <a href="#" id="footerWhatsapp" data-en="WhatsApp" data-es="WhatsApp"></a>
            <a href="#" onclick="showPage('catalog'); return false;" data-en="Shop" data-es="Tienda"></a>
        </div>
        <p class="footer-copy">&copy; <span id="year"></span> <span id="footerBrand2">Gori Didi</span></p>
    </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
