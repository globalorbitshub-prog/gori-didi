<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gori Didi - Indian Products</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f1e8; color: #2c2c2a; }
        .app { display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: #8b0000; color: white; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 1rem; }
        .logo-text { font-size: 1.5rem; font-weight: 600; }
        .nav { display: flex; gap: 1rem; }
        .nav button { background: none; border: none; color: white; cursor: pointer; font-size: 1rem; padding: 0.5rem 1rem; }
        .nav button:hover { opacity: 0.8; }
        .main { flex: 1; padding: 2rem; max-width: 1200px; width: 100%; margin: 0 auto; }
        .hero { background: #8b0000; color: white; padding: 3rem 2rem; border-radius: 12px; text-align: center; margin-bottom: 2rem; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .btn { padding: 0.8rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 500; }
        .btn-primary { background: #d4af37; color: #8b0000; }
        .btn-primary:hover { background: #c99f31; }
        .btn-dark { background: #003366; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .card { background: white; border-radius: 12px; border: 1px solid #ddd; overflow: hidden; }
        .card-img { height: 150px; background: #e8e4d8; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .card-body { padding: 1rem; }
        .card-title { font-weight: 600; color: #8b0000; margin-bottom: 0.5rem; }
        .card-price { font-size: 1.3rem; color: #d4af37; font-weight: 700; margin: 0.5rem 0; }
        .btn-small { padding: 0.6rem 1rem; font-size: 0.9rem; width: 100%; }
        .hidden { display: none; }
        .section { background: white; padding: 1.5rem; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; }
        .footer { background: #003366; color: white; padding: 1rem; text-align: center; }
        .cart-item { display: flex; gap: 1rem; padding: 1rem; border-bottom: 1px solid #eee; }
        .cart-item-img { width: 80px; height: 80px; background: #e8e4d8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .cart-total { font-size: 1.3rem; font-weight: 700; color: #8b0000; margin-top: 1rem; padding-top: 1rem; border-top: 2px solid #d4af37; }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr 1fr; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo">
            <div style="font-size: 1.5rem;">🇮🇳</div>
            <div class="logo-text" id="businessName">Gori Didi</div>
        </div>
        <nav class="nav">
            <button onclick="showPage('landing')">Home</button>
            <button onclick="showPage('catalog')">Products</button>
            <button onclick="showPage('cart')">Cart (<span id="cartCount">0</span>)</button>
            <button onclick="showPage('admin')">Admin</button>
        </nav>
    </header>

    <main class="main">
        <div id="landing" class="page">
            <div class="hero">
                <h1 id="bannerText">Authentic Indian Products</h1>
                <p>Discover the beauty and culture of India</p>
                <button class="btn btn-primary" onclick="showPage('catalog')">Shop Now</button>
            </div>
            <h2 style="color:#8b0000">Featured Products</h2>
            <div class="grid" id="featuredGrid"></div>
        </div>

        <div id="catalog" class="page hidden">
            <h1 style="color:#8b0000; margin-bottom:1rem">Our Products</h1>
            <div class="grid" id="catalogGrid"></div>
        </div>

        <div id="cart" class="page hidden">
            <h1 style="color:#8b0000; margin-bottom:1.5rem">Shopping Cart</h1>
            <div class="section" id="cartContent"></div>
        </div>

        <div id="admin" class="page hidden">
            <h1 style="color:#8b0000">Admin Panel</h1>
            <div id="adminLogin" class="section" style="max-width: 400px;">
                <h2 style="color:#8b0000; margin-bottom:1rem">Login</h2>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password">
                </div>
                <button class="btn btn-primary btn-small" onclick="adminLogin()">Login</button>
            </div>
            <div id="adminDash" class="hidden">
                <div class="section">
                    <h2 style="color:#8b0000">Business Settings</h2>
                    <div class="form-group">
                        <label>Business Name</label>
                        <input type="text" id="businessNameInput">
                    </div>
                    <div class="form-group">
                        <label>Banner Text</label>
                        <input type="text" id="bannerTextInput">
                    </div>
                    <button class="btn btn-primary btn-small" onclick="saveBusiness()">Save</button>
                    <button class="btn btn-dark btn-small" onclick="adminLogout()" style="margin-top:0.5rem">Logout</button>
                </div>
                <div class="section">
                    <h2 style="color:#8b0000">Add Product</h2>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="productName">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="productCategory">
                            <option>MODA</option>
                            <option>TRAJES</option>
                            <option>ACCESORIOS</option>
                            <option>TEXTIL</option>
                            <option>DECORACIÓN</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price</label>
                        <input type="number" id="productPrice" step="0.01">
                    </div>
                    <button class="btn btn-primary btn-small" onclick="addProduct()">Add</button>
                </div>
                <div class="section">
                    <h2 style="color:#8b0000">Products</h2>
                    <div id="productsList"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 <span id="footerName">Gori Didi</span> - Authentic Indian Products</p>
    </footer>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('cart') || '[]');
let products = JSON.parse(localStorage.getItem('products') || '[]');
let businessName = localStorage.getItem('businessName') || 'Gori Didi';
let bannerText = localStorage.getItem('bannerText') || 'Authentic Indian Products';
let isAdminLoggedIn = false;
let adminPassword = 'gori2024';

if (products.length === 0) {
    products = [
        { id: 1, name: 'Kurtis Women', category: 'MODA', price: 35, emoji: '👗' },
        { id: 2, name: 'Silk Scarves', category: 'ACCESORIOS', price: 25, emoji: '🧣' },
        { id: 3, name: 'Bollywood Saree', category: 'TRAJES', price: 65, emoji: '👚' },
        { id: 4, name: 'Brass Decorations', category: 'DECORACIÓN', price: 45, emoji: '🏛️' },
        { id: 5, name: 'Cotton Cushion', category: 'TEXTIL', price: 30, emoji: '🛋️' },
        { id: 6, name: 'Bindi Set', category: 'ACCESORIOS', price: 12, emoji: '✨' },
    ];
    localStorage.setItem('products', JSON.stringify(products));
}

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    if (page === 'landing') renderFeatured();
    if (page === 'catalog') renderCatalog();
    if (page === 'cart') renderCart();
}

function renderFeatured() {
    const html = products.slice(0, 3).map(p => `
        <div class="card">
            <div class="card-img">${p.emoji}</div>
            <div class="card-body">
                <div class="card-title">${p.name}</div>
                <div class="card-price">$${p.price.toFixed(2)}</div>
                <button class="btn btn-primary btn-small" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
        </div>
    `).join('');
    document.getElementById('featuredGrid').innerHTML = html;
}

function renderCatalog() {
    const html = products.map(p => `
        <div class="card">
            <div class="card-img">${p.emoji}</div>
            <div class="card-body">
                <div style="font-size:0.85rem; color:#888">${p.category}</div>
                <div class="card-title">${p.name}</div>
                <div class="card-price">$${p.price.toFixed(2)}</div>
                <button class="btn btn-primary btn-small" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
        </div>
    `).join('');
    document.getElementById('catalogGrid').innerHTML = html;
}

function renderCart() {
    if (cart.length === 0) {
        document.getElementById('cartContent').innerHTML = '<p style="text-align:center; color:#888">Cart is empty</p>';
        return;
    }
    const total = cart.reduce((sum, p) => sum + (p.price * p.qty), 0);
    const html = `
        ${cart.map(p => `
            <div class="cart-item">
                <div class="cart-item-img">${p.emoji}</div>
                <div>
                    <div style="font-weight:600">${p.name}</div>
                    <div style="font-size:0.9rem; color:#888">${p.category}</div>
                    <input type="number" value="${p.qty}" min="1" onchange="updateQty(${p.id}, this.value)" style="width:60px; padding:0.4rem; margin-top:0.5rem">
                    <button class="btn btn-dark btn-small" onclick="removeFromCart(${p.id})" style="width:auto; padding:0.4rem 0.8rem; margin-left:0.5rem">Remove</button>
                </div>
                <div style="text-align:right; font-weight:700; color:#d4af37">$${(p.price * p.qty).toFixed(2)}</div>
            </div>
        `).join('')}
        <div class="cart-total">Total: $${total.toFixed(2)}</div>
        <button class="btn btn-primary btn-small" onclick="checkoutWhatsApp()" style="margin-top:1rem; padding:1rem; font-size:1rem">Checkout via WhatsApp</button>
    `;
    document.getElementById('cartContent').innerHTML = html;
}

function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(p => p.id === id);
    if (existing) {
        existing.qty++;
    } else {
        cart.push({...product, qty: 1});
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
}

function removeFromCart(id) {
    cart = cart.filter(p => p.id !== id);
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    renderCart();
}

function updateQty(id, qty) {
    const item = cart.find(p => p.id === id);
    if (item) item.qty = parseInt(qty) || 1;
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function checkoutWhatsApp() {
    if (cart.length === 0) return;
    const total = cart.reduce((sum, p) => sum + (p.price * p.qty), 0);
    const itemsList = cart.map(p => `${p.name} x${p.qty} - $${(p.price * p.qty).toFixed(2)}`).join('%0A');
    const msg = `Hello! I'd like to order:%0A%0A${itemsList}%0A%0ATotal: $${total.toFixed(2)}`;
    window.open(`https://wa.me/?text=${msg}`);
}

function updateCartCount() {
    document.getElementById('cartCount').innerText = cart.length;
}

function adminLogin() {
    const pwd = document.getElementById('adminPassword').value;
    if (pwd === adminPassword) {
        isAdminLoggedIn = true;
        document.getElementById('adminLogin').classList.add('hidden');
        document.getElementById('adminDash').classList.remove('hidden');
        document.getElementById('businessNameInput').value = businessName;
        document.getElementById('bannerTextInput').value = bannerText;
        renderProductsList();
    } else {
        alert('Invalid password');
    }
}

function adminLogout() {
    isAdminLoggedIn = false;
    document.getElementById('adminLogin').classList.remove('hidden');
    document.getElementById('adminDash').classList.add('hidden');
    document.getElementById('adminPassword').value = '';
}

function saveBusiness() {
    businessName = document.getElementById('businessNameInput').value;
    bannerText = document.getElementById('bannerTextInput').value;
    localStorage.setItem('businessName', businessName);
    localStorage.setItem('bannerText', bannerText);
    document.getElementById('businessName').innerText = businessName;
    document.getElementById('bannerText').innerText = bannerText;
    document.getElementById('footerName').innerText = businessName;
    alert('Saved!');
}

function addProduct() {
    const name = document.getElementById('productName').value;
    const category = document.getElementById('productCategory').value;
    const price = parseFloat(document.getElementById('productPrice').value);
    if (name && price) {
        products.push({ id: Date.now(), name, category, price, emoji: '📦' });
        localStorage.setItem('products', JSON.stringify(products));
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        renderProductsList();
    }
}

function renderProductsList() {
    const html = products.map(p => `
        <div style="background:#f9f7f3; padding:1rem; border-radius:8px; margin-bottom:1rem; display:flex; justify-content:space-between;">
            <div>
                <div style="font-weight:600">${p.emoji} ${p.name}</div>
                <div style="font-size:0.9rem; color:#888">${p.category} - $${p.price.toFixed(2)}</div>
            </div>
            <button class="btn btn-dark btn-small" onclick="deleteProduct(${p.id})" style="width:auto">Delete</button>
        </div>
    `).join('');
    document.getElementById('productsList').innerHTML = html;
}

function deleteProduct(id) {
    products = products.filter(p => p.id !== id);
    localStorage.setItem('products', JSON.stringify(products));
    renderProductsList();
}

document.getElementById('businessName').innerText = businessName;
document.getElementById('bannerText').innerText = bannerText;
document.getElementById('footerName').innerText = businessName;
updateCartCount();
showPage('landing');
</script>
</body>
</html>
